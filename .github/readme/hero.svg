  <text x="18" y="58" style="font-family:'JetBrains Mono','Cascadia Code','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace;font-size:14px;white-space:pre" fill="#FF7B72" xml:space="preserve">#include &lt;termios.h&gt;</text><text x="18" y="78" style="font-family:'JetBrains Mono','Cascadia Code','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace;font-size:14px;white-space:pre" fill="#E6EDF3" xml:space="preserve"></text><text x="18" y="98" style="font-family:'JetBrains Mono','Cascadia Code','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace;font-size:14px;white-space:pre" fill="#D2A8FF" xml:space="preserve">void enableRawMode() {</text><text x="18" y="118" style="font-family:'JetBrains Mono','Cascadia Code','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace;font-size:14px;white-space:pre" fill="#E6EDF3" xml:space="preserve">  tcgetattr(STDIN_FILENO, &amp;E.orig_termios);</text><text x="18" y="138" style="font-family:'JetBrains Mono','Cascadia Code','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace;font-size:14px;white-space:pre" fill="#E6EDF3" xml:space="preserve">  atexit(disableRawMode);</text><text x="18" y="158" style="font-family:'JetBrains Mono','Cascadia Code','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace;font-size:14px;white-space:pre" fill="#E6EDF3" xml:space="preserve">  struct termios raw = E.orig_termios;</text><text x="18" y="178" style="font-family:'JetBrains Mono','Cascadia Code','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace;font-size:14px;white-space:pre" fill="#E6EDF3" xml:space="preserve">  raw.c_lflag &amp;= ~(ECHO | ICANON);</text><text x="18" y="198" style="font-family:'JetBrains Mono','Cascadia Code','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace;font-size:14px;white-space:pre" fill="#E6EDF3" xml:space="preserve">  tcsetattr(STDIN_FILENO, TCSAFLUSH, &amp;raw);</text><text x="18" y="218" style="font-family:'JetBrains Mono','Cascadia Code','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace;font-size:14px;white-space:pre" fill="#E6EDF3" xml:space="preserve">}</text>

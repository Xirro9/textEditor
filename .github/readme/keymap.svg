<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="236" viewBox="0 0 1280 236" role="img" aria-labelledby="t d">
<title id="t">Keymap</title>
<desc id="d">Ctrl-S: save (prompts for a name); Ctrl-Q: quit (3× if unsaved); Ctrl-F: incremental search; ← ↑ → ↓: move the cursor; PgUp / PgDn: scroll a screen; Home / End: line start / end; Backspace / Del: delete a character; Enter: split the line</desc>
<style>@media (prefers-reduced-motion: reduce){*{animation:none!important;}}</style>
<rect width="1280" height="236" rx="24" fill="#0D1117" stroke="#30363D" stroke-width="2"/>
<text x="40" y="44" style="font-family:'JetBrains Mono','Cascadia Code','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace;font-size:14px;letter-spacing:3px" fill="#7EE787">KEYMAP</text>
<g transform="translate(40 66)"><rect width="100" height="40" rx="8" fill="#161B22" stroke="#30363D"/><rect width="100" height="36" rx="8" fill="#21262D"/><text x="50" y="24" text-anchor="middle" style="font-family:'JetBrains Mono','Cascadia Code','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace;font-size:15px;font-weight:700" fill="#E6EDF3">Ctrl-S</text>
    <text x="114" y="25" style="font-family:'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;font-size:15px" fill="#C9D1D9">save (prompts for a name)</text></g><g transform="translate(650 66)"><rect width="100" height="40" rx="8" fill="#161B22" stroke="#30363D"/><rect width="100" height="36" rx="8" fill="#21262D"/><text x="50" y="24" text-anchor="middle" style="font-family:'JetBrains Mono','Cascadia Code','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace;font-size:15px;font-weight:700" fill="#E6EDF3">Ctrl-Q</text>
    <text x="114" y="25" style="font-family:'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;font-size:15px" fill="#C9D1D9">quit (3× if unsaved)</text></g><g transform="translate(40 108)"><rect width="100" height="40" rx="8" fill="#161B22" stroke="#30363D"/><rect width="100" height="36" rx="8" fill="#21262D"/><text x="50" y="24" text-anchor="middle" style="font-family:'JetBrains Mono','Cascadia Code','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace;font-size:15px;font-weight:700" fill="#E6EDF3">Ctrl-F</text>
    <text x="114" y="25" style="font-family:'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;font-size:15px" fill="#C9D1D9">incremental search</text></g><g transform="translate(650 108)"><rect width="111" height="40" rx="8" fill="#161B22" stroke="#30363D"/><rect width="111" height="36" rx="8" fill="#21262D"/><text x="55.5" y="24" text-anchor="middle" style="font-family:'JetBrains Mono','Cascadia Code','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace;font-size:15px;font-weight:700" fill="#E6EDF3">← ↑ → ↓</text>
    <text x="125" y="25" style="font-family:'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;font-size:15px" fill="#C9D1D9">move the cursor</text></g><g transform="translate(40 150)"><rect width="155" height="40" rx="8" fill="#161B22" stroke="#30363D"/><rect width="155" height="36" rx="8" fill="#21262D"/><text x="77.5" y="24" text-anchor="middle" style="font-family:'JetBrains Mono','Cascadia Code','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace;font-size:15px;font-weight:700" fill="#E6EDF3">PgUp / PgDn</text>
    <text x="169" y="25" style="font-family:'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;font-size:15px" fill="#C9D1D9">scroll a screen</text></g><g transform="translate(650 150)"><rect width="144" height="40" rx="8" fill="#161B22" stroke="#30363D"/><rect width="144" height="36" rx="8" fill="#21262D"/><text x="72" y="24" text-anchor="middle" style="font-family:'JetBrains Mono','Cascadia Code','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace;font-size:15px;font-weight:700" fill="#E6EDF3">Home / End</text>
    <text x="158" y="25" style="font-family:'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;font-size:15px" fill="#C9D1D9">line start / end</text></g><g transform="translate(40 192)"><rect width="199" height="40" rx="8" fill="#161B22" stroke="#30363D"/><rect width="199" height="36" rx="8" fill="#21262D"/><text x="99.5" y="24" text-anchor="middle" style="font-family:'JetBrains Mono','Cascadia Code','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace;font-size:15px;font-weight:700" fill="#E6EDF3">Backspace / Del</text>
    <text x="213" y="25" style="font-family:'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;font-size:15px" fill="#C9D1D9">delete a character</text></g><g transform="translate(650 192)"><rect width="89" height="40" rx="8" fill="#161B22" stroke="#30363D"/><rect width="89" height="36" rx="8" fill="#21262D"/><text x="44.5" y="24" text-anchor="middle" style="font-family:'JetBrains Mono','Cascadia Code','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace;font-size:15px;font-weight:700" fill="#E6EDF3">Enter</text>
    <text x="103" y="25" style="font-family:'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;font-size:15px" fill="#C9D1D9">split the line</text></g>
</svg>
